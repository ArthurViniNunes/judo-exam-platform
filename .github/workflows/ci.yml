name: Qualidade do projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Testes, lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar testes
        run: pnpm test

      - name: Verificar lint
        run: pnpm lint

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Gerar build
        run: pnpm build

  deploy:
    name: Publicar na Cloudflare
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: cloudflare-production
      cancel-in-progress: false

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_API_URL: https://judo-exam-api.judo-rogerio-cruz.workers.dev

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Conferir credenciais de publicação
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Cadastre CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_API_TOKEN nos secrets do GitHub Actions."
            exit 1
          fi

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar migrações pendentes no D1
        run: pnpm backend:migrate:remote

      - name: Publicar API
        run: pnpm backend:deploy

      - name: Gerar frontend de produção
        run: pnpm build

      - name: Publicar frontend
        run: pnpm frontend:deploy

      - name: Verificar ambiente publicado
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            https://judo-exam-api.judo-rogerio-cruz.workers.dev/health
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --output /dev/null \
            https://judo-exam-platform.judo-rogerio-cruz.workers.dev/
