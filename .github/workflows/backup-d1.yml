name: Backup do banco D1

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      incluir_copia_mensal:
        description: Criar tambem uma copia na retencao mensal
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup-d1-production
  cancel-in-progress: false

jobs:
  backup:
    name: Exportar, armazenar e conferir
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      BACKUP_BUCKET: ${{ vars.B2_BACKUP_BUCKET || secrets.B2_BACKUP_BUCKET }}
      B2_REGION: ${{ vars.B2_REGION || secrets.B2_REGION }}
      DATABASE_NAME: judo-exam-db
      FORCE_MONTHLY: ${{ inputs.incluir_copia_mensal || false }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Conferir configuracao protegida
        shell: bash
        run: |
          missing=0
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Account ID ausente::Cadastre CLOUDFLARE_ACCOUNT_ID como secret ou variable do repositorio."
            missing=1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error title=Token ausente::Cadastre CLOUDFLARE_BACKUP_API_TOKEN. Como contingencia, o workflow aceita CLOUDFLARE_API_TOKEN."
            missing=1
          fi
          if [[ -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "::error title=Key ID ausente::Cadastre B2_KEY_ID em Secrets."
            missing=1
          fi
          if [[ -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error title=Application Key ausente::Cadastre B2_APPLICATION_KEY em Secrets."
            missing=1
          fi
          if [[ -z "$BACKUP_BUCKET" ]]; then
            echo "::error title=Bucket ausente::Cadastre B2_BACKUP_BUCKET em Variables. O mesmo nome em Secrets tambem e aceito."
            missing=1
          fi
          if [[ -z "$B2_REGION" ]]; then
            echo "::error title=Regiao ausente::Cadastre B2_REGION em Variables, por exemplo us-west-004."
            missing=1
          fi
          exit "$missing"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Conferir acesso ao D1 e ao B2
        shell: bash
        run: |
          set -euo pipefail
          b2_endpoint="https://s3.${B2_REGION}.backblazeb2.com"
          pnpm exec wrangler d1 info "$DATABASE_NAME" --config backend/wrangler.jsonc --json > /dev/null
          aws --version
          aws s3api head-bucket \
            --bucket "$BACKUP_BUCKET" \
            --endpoint-url "$b2_endpoint" \
            --region "$B2_REGION" > /dev/null

      - name: Exportar e gerar manifesto
        id: files
        shell: bash
        run: |
          set -euo pipefail

          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          day="$(date -u +%d)"
          backup_dir="$RUNNER_TEMP/d1-backup"
          base_name="${DATABASE_NAME}-${stamp}"
          sql_file="$backup_dir/${base_name}.sql"
          archive_file="${sql_file}.gz"
          checksum_file="${archive_file}.sha256"
          manifest_file="$backup_dir/${base_name}.manifest.json"

          mkdir -p "$backup_dir"
          pnpm exec wrangler d1 export "$DATABASE_NAME" \
            --remote \
            --skip-confirmation \
            --output "$sql_file" \
            --config backend/wrangler.jsonc

          gzip -9 "$sql_file"
          archive_name="$(basename "$archive_file")"
          checksum_name="$(basename "$checksum_file")"
          manifest_name="$(basename "$manifest_file")"
          checksum="$(sha256sum "$archive_file" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$archive_name" > "$checksum_file"

          jq -n \
            --arg createdAt "$created_at" \
            --arg database "$DATABASE_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg archive "$archive_name" \
            --arg sha256 "$checksum" \
            --argjson compressedBytes "$(stat -c '%s' "$archive_file")" \
            '{version: 1, createdAt: $createdAt, database: $database, commit: $commit, archive: $archive, sha256: $sha256, compressedBytes: $compressedBytes}' \
            > "$manifest_file"

          {
            echo "backup_dir=$backup_dir"
            echo "archive_name=$archive_name"
            echo "checksum_name=$checksum_name"
            echo "manifest_name=$manifest_name"
            echo "daily_prefix=daily/$(date -u +%Y/%m/%d)"
            echo "monthly_prefix=monthly/$(date -u +%Y/%m)"
            if [[ "$day" == "01" || "$FORCE_MONTHLY" == "true" ]]; then
              echo "create_monthly=true"
            else
              echo "create_monthly=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Enviar copia diaria ao B2
        shell: bash
        env:
          BACKUP_DIR: ${{ steps.files.outputs.backup_dir }}
          ARCHIVE_NAME: ${{ steps.files.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.files.outputs.checksum_name }}
          MANIFEST_NAME: ${{ steps.files.outputs.manifest_name }}
          PREFIX: ${{ steps.files.outputs.daily_prefix }}
        run: |
          set -euo pipefail
          b2_endpoint="https://s3.${B2_REGION}.backblazeb2.com"
          aws s3 cp "$BACKUP_DIR/$ARCHIVE_NAME" "s3://$BACKUP_BUCKET/$PREFIX/$ARCHIVE_NAME" --endpoint-url "$b2_endpoint" --region "$B2_REGION" --content-type application/gzip --only-show-errors
          aws s3 cp "$BACKUP_DIR/$CHECKSUM_NAME" "s3://$BACKUP_BUCKET/$PREFIX/$CHECKSUM_NAME" --endpoint-url "$b2_endpoint" --region "$B2_REGION" --content-type text/plain --only-show-errors
          aws s3 cp "$BACKUP_DIR/$MANIFEST_NAME" "s3://$BACKUP_BUCKET/$PREFIX/$MANIFEST_NAME" --endpoint-url "$b2_endpoint" --region "$B2_REGION" --content-type application/json --only-show-errors

      - name: Enviar copia mensal ao B2
        if: steps.files.outputs.create_monthly == 'true'
        shell: bash
        env:
          BACKUP_DIR: ${{ steps.files.outputs.backup_dir }}
          ARCHIVE_NAME: ${{ steps.files.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.files.outputs.checksum_name }}
          MANIFEST_NAME: ${{ steps.files.outputs.manifest_name }}
          PREFIX: ${{ steps.files.outputs.monthly_prefix }}
        run: |
          set -euo pipefail
          b2_endpoint="https://s3.${B2_REGION}.backblazeb2.com"
          aws s3 cp "$BACKUP_DIR/$ARCHIVE_NAME" "s3://$BACKUP_BUCKET/$PREFIX/$ARCHIVE_NAME" --endpoint-url "$b2_endpoint" --region "$B2_REGION" --content-type application/gzip --only-show-errors
          aws s3 cp "$BACKUP_DIR/$CHECKSUM_NAME" "s3://$BACKUP_BUCKET/$PREFIX/$CHECKSUM_NAME" --endpoint-url "$b2_endpoint" --region "$B2_REGION" --content-type text/plain --only-show-errors
          aws s3 cp "$BACKUP_DIR/$MANIFEST_NAME" "s3://$BACKUP_BUCKET/$PREFIX/$MANIFEST_NAME" --endpoint-url "$b2_endpoint" --region "$B2_REGION" --content-type application/json --only-show-errors

      - name: Baixar e verificar a copia diaria
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.files.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.files.outputs.checksum_name }}
          PREFIX: ${{ steps.files.outputs.daily_prefix }}
        run: |
          set -euo pipefail
          b2_endpoint="https://s3.${B2_REGION}.backblazeb2.com"
          verify_dir="$RUNNER_TEMP/d1-backup-verify"
          mkdir -p "$verify_dir"
          aws s3 cp "s3://$BACKUP_BUCKET/$PREFIX/$ARCHIVE_NAME" "$verify_dir/$ARCHIVE_NAME" --endpoint-url "$b2_endpoint" --region "$B2_REGION" --only-show-errors
          aws s3 cp "s3://$BACKUP_BUCKET/$PREFIX/$CHECKSUM_NAME" "$verify_dir/$CHECKSUM_NAME" --endpoint-url "$b2_endpoint" --region "$B2_REGION" --only-show-errors
          cd "$verify_dir"
          sha256sum --check "$CHECKSUM_NAME"
